name: Portfolio CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # Vercel serves the static files directly; no npm install or build is needed.
      - name: Check JavaScript syntax
        run: git ls-files -z -- '*.js' | xargs -0 -r -n 1 node --check

      - name: Check local assets and page links
        run: python3 scripts/check_site.py
